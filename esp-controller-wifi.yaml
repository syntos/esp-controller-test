# GENERATED FILE - do not edit by hand.
# Source: src/common.yaml + src/network-wifi.yaml. Rebuild with: python tools/build_yaml.py
#
# Logi.casa ESP Home Controller, wifi variant, version 1.1.2.
# Contains no private secrets. Your own API key is created when you take control in ESPHome Builder.

substitutions:
  project_version: "1.1.2"
  factory_api_key: "hLGjhf96voA4hxDAVuzz8/9QTL8kgiMh+las8DLf5L8="
  editor_url: "https://syntos.github.io/esp-controller-test/"
  device_name: logicasa-wifi
  friendly_name: LogiCasa Controller
  prefix: esp

# Used by ESPHome Builder when a user clicks "Take Control": it creates a small personal
# config with its own API key that points to this file.
dashboard_import:
  package_import_url: github://syntos/esp-controller-test/esp-controller-wifi.yaml@main
  import_full_config: false

external_components:
  - source:
      type: git
      url: https://github.com/syntos/esp-controller-test
      ref: main
    refresh: always
    components: [fallback_engine]

wifi:
  # Fallback hotspot, used when the controller cannot connect to a network
  ap:
    password: "LogiCasa"

# Together with the hotspot, this lets the user enter WiFi credentials in a browser.
captive_portal:

# Lets the user enter WiFi credentials right after flashing, over the USB cable.
improv_serial:
  next_url: https://www.logi.casa

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ESP IP Address
    mac_address:
      name: ESP MAC Address

sensor:
  - platform: wifi_signal
    name: "${prefix}_WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic
  - platform: copy
    source_id: wifi_signal_db
    name: "${prefix}_WiFi Signal"
    id: wifi_signal_pct
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: diagnostic

esphome:
  min_version: 2026.9.0
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: logicasa.esp-controller
    version: "${project_version}"
  on_boot:
    priority: 600
    then:
      - light.turn_on:
          id: statusled
          green: 0.0
          red: 1.0
          blue: 0.0

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: WARN

# The API key below is a PUBLIC factory key, only used until you "Take Control" of the
# controller in ESPHome Builder. That step generates your own private key.
# reboot_timeout: 0s stops the controller from restarting when Home Assistant is away
# for a long time, so the offline fallback keeps working.
# The status LED colours (blue / purple / orange) are handled by the fallback_engine below,
# which only counts Home Assistant as connected, not other API clients such as the log viewer.
api:
  encryption:
    key: "${factory_api_key}"
  reboot_timeout: 0s

ota:
  - platform: esphome

i2c:
  sda: 32
  scl: 33
  scan: true

