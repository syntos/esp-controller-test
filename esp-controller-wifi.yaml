  # Button in Home Assistant to reset the password of the fallback page
  - platform: template
    id: ${prefix}_reset_fallback_password
    name: "Reset fallback password"
    entity_category: config
    on_press:
      - lambda: id(fallback).reset_password();
  # Button in Home Assistant to erase all stored fallback rules
  - platform: template
    id: ${prefix}_clear_fallback_rules
    name: "Clear fallback rules"
    entity_category: config
    on_press:
      - lambda: id(fallback).clear_rules();

# Offline fallback. The order of the lists determines the number used in the fallback file:
# inputs[0] = ${prefix}_INPUT_01 = "in": 0     outputs[0] = ch_01 = "out": 0
fallback_engine:
  id: fallback
  disconnect_delay: 15s
  reconnect_delay: 10s
  # After power-up the status LED stays red for this long when Home Assistant is not
  # connected, then turns orange. The fallback itself starts after disconnect_delay.
  boot_led_delay: 60s
  # Optional: a PUSH-BUTTON input to reset the fallback page password without Home
  # Assistant. Press it within 60 s after power-up and hold it for 10 s. The status
  # LED blinks white while you hold and turns steady green when the password has been
  # reset: release the button then. A button that is already held down at power-up is
  # ignored. Use a push button, not a wall switch, and do not use this input in
  # fallback rules.
  reset_input: ${prefix}_INPUT_48
  status_light: statusled
  editor_url: ${editor_url}
  inputs:
