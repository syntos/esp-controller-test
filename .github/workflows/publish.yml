name: Publish firmware and website

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create a release when a tag is pushed
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        variant: [ethernet, wifi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Checks
        run: |
          python tools/build_yaml.py --check
          python tools/check_entities.py
      - name: A release tag must match the version in project.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import json;print(json.load(open('project.json'))['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match project.json version $version"; exit 1; }
      - id: cfg
        run: echo "esphome=$(python -c "import json;print(json.load(open('project.json'))['esphome_version'])")" >> "$GITHUB_OUTPUT"
      - name: Generate the YAML that uses the components of this checkout
        run: python tools/build_yaml.py --local --out build
      - name: Compile
        uses: esphome/build-action@v6
        with:
          yaml-file: build/esp-controller-${{ matrix.variant }}.yaml
          version: ${{ steps.cfg.outputs.esphome }}
          complete-manifest: true
      - name: Collect the firmware files
        run: |
          mkdir -p "out/${{ matrix.variant }}"
          find . -type f \( -name '*.factory.bin' -o -name '*.ota.bin' -o -name 'manifest.json' \) \
            -not -path './.git/*' -not -path './out/*' -not -path './site/*' -print -exec cp {} "out/${{ matrix.variant }}/" \;
          test -f "out/${{ matrix.variant }}/manifest.json" || { echo "No manifest.json was produced"; ls -R . | head -50; exit 1; }
          ls -l "out/${{ matrix.variant }}"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: out/${{ matrix.variant }}
          if-no-files-found: error

  site:
    name: Website
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: firmware-artifacts
      - name: Assemble the website
        run: |
          mkdir -p _site/firmware
          cp -r site/. _site/
          for v in ethernet wifi; do
            mkdir -p "_site/firmware/$v"
            cp firmware-artifacts/firmware-$v/* "_site/firmware/$v/"
          done
          touch _site/.nojekyll
          find _site -maxdepth 3 -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: firmware-artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          for v in ethernet wifi; do
            for f in firmware-artifacts/firmware-$v/*.bin; do
              cp "$f" "release/$(basename "$f" .bin)-$v.bin"
            done
          done
          gh release create "${GITHUB_REF_NAME}" release/*.bin --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes