<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4EC3E0">
<meta name="description" content="Build the offline fallback rules for your Logi.casa ESP Home Controller: choose which input switches which output, then download the file.">
<title>Fallback editor – Logi.casa</title>
<link rel="icon" type="image/png" href="data:image/png;base64,__FAVICON__">
<style>
:root{
  --blue:#4EC3E0; --green:#00965E;
  --blue-strong:#0A7B97; --green-strong:#00784B; --on-strong:#fff;
  --blue-ink:#0A7B97; --green-ink:#007A4D;
  --blue-tint:#E7F6FA; --green-tint:#E5F5EE;
  --ink:#10303A; --ink-2:#4A6770; --line:#D5E4EA; --bg:#F2F8FA; --surface:#fff;
  --warn:#8A5300; --warn-tint:#FFF3DC; --err:#B42525; --err-tint:#FDEAEA;
  --shadow:0 1px 2px rgba(16,48,58,.06),0 6px 20px rgba(16,48,58,.05);
  --radius:18px;
  --font:"Futura","Futura PT","Century Gothic","Avenir Next","Avenir","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --blue-strong:#4EC3E0; --green-strong:#2FBF86; --on-strong:#04222B;
    --blue-ink:#7FD6EC; --green-ink:#5BD8A6;
    --blue-tint:#0F2E38; --green-tint:#0B2D24;
    --ink:#E7F4F7; --ink-2:#9CB8C1; --line:#25444D; --bg:#0A171C; --surface:#10252C;
    --warn:#F2B654; --warn-tint:#33260C; --err:#FF8E8E; --err-tint:#3A1616;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.15;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
a{color:var(--blue-ink)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}

/* header */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;min-height:68px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;text-decoration:none}
.brand .mark{height:40px;width:auto;display:block}
.brand .word{height:21px;width:auto;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 15px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;transition:border-color .15s,background-color .15s}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--green-strong);border-color:var(--green-strong);color:var(--on-strong)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;filter:none}
.btn.small{min-height:34px;padding:0 12px;font-size:.92rem}
.lang{min-width:46px;padding:0 10px}

/* intro */
.intro{padding:30px 0 6px}
.intro h1{font-size:clamp(1.75rem,3.4vw,2.4rem);font-weight:700}
.intro p{max-width:62ch;color:var(--ink-2);margin-top:8px}
.steps{display:flex;flex-wrap:wrap;gap:10px 30px;list-style:none;margin:20px 0 0;padding:0;counter-reset:s}
.steps li{display:flex;align-items:center;gap:10px;font-weight:600}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#06303B;font-weight:700;font-size:.92rem}
.steps li:last-child::before{background:var(--green-strong);color:var(--on-strong)}

/* tabs */
.tabs{display:flex;gap:4px;margin:24px 0 18px;border-bottom:1.5px solid var(--line);overflow-x:auto}
.tab{appearance:none;background:none;border:0;padding:11px 14px;font-weight:600;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--green)}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--blue-tint);color:var(--blue-ink);font-size:.8rem;margin-left:7px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.toolbar .grow{flex:1 1 220px;min-width:0}
.search{position:relative;display:block}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-2);pointer-events:none}
.search input{width:100%;min-height:40px;padding:0 14px 0 38px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface)}
.count{color:var(--ink-2);font-size:.92rem;margin-left:auto}
.menu{position:relative}
.menu summary{list-style:none}
.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;z-index:10;top:calc(100% + 6px);left:0;min-width:300px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer}
.menu-pop button:hover{background:var(--bg)}

/* checks */
.checks{margin-bottom:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);overflow:hidden}
.checks.ok{display:flex;align-items:center;gap:10px;padding:10px 14px;color:var(--green-ink);font-weight:600}
.checks summary{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;font-weight:600}
.checks.has-err{border-color:var(--err);background:var(--err-tint)}
.checks.has-warn{border-color:#E0B25A;background:var(--warn-tint)}
.checks.has-err summary{color:var(--err)}
.checks.has-warn summary{color:var(--warn)}
.checks ul{list-style:none;margin:0;padding:0 14px 12px}
.checks li button{border:0;background:none;padding:5px 0;text-align:left;cursor:pointer;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* rule cards */
.rules{display:grid;gap:14px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px 14px;display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);box-shadow:var(--shadow)}
.rule.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--blue)}100%{box-shadow:var(--shadow)}}
.rule-top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.rule-n{font-weight:700;color:var(--ink-2);font-size:.95rem;padding-left:4px}
.tools{display:flex;gap:2px}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;border:0;background:none;color:var(--ink-2);cursor:pointer}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.half{border-radius:14px;padding:12px 14px 15px;border-left:7px solid;display:flex;flex-direction:column;gap:11px;min-width:0}
.half.in{background:var(--blue-tint);border-color:var(--blue)}
.half.out{background:var(--green-tint);border-color:var(--green)}
.half-h{font-weight:700;color:var(--blue-ink)}
.half.out .half-h{color:var(--green-ink)}
.link{display:grid;place-items:center;color:var(--ink-2)}
.link .ic{width:1.6em;height:1.6em}
.pick{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left}
.in .pick:hover{border-color:var(--blue)}
.out .pick:hover{border-color:var(--green)}
.pick-text{display:flex;flex-direction:column;min-width:0}
.pick-text b{font-size:1.05rem}
.pick-text small{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:.93rem;font-weight:600;line-height:1.2}
.in .seg-btn:hover{border-color:var(--blue)}
.out .seg-btn:hover{border-color:var(--green)}
.in .seg-btn[aria-pressed=true]{background:var(--blue-strong);border-color:var(--blue-strong);color:var(--on-strong)}
.out .seg-btn[aria-pressed=true]{background:var(--green-strong);border-color:var(--green-strong);color:var(--on-strong)}
.hint{color:var(--ink-2);font-size:.9rem;max-width:46ch}
.dur{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dur label{display:flex;align-items:center;gap:8px;font-weight:600}
.dur input,.dur select{min-height:40px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px}
.dur input{width:96px}
@media(max-width:760px){
  .rule{grid-template-columns:minmax(0,1fr)}
  .link{height:34px}
  .link .ic{transform:rotate(90deg)}
}

/* empty */
.empty{display:grid;justify-items:center;gap:14px;text-align:center;padding:54px 16px;border:2px dashed var(--line);border-radius:var(--radius);background:var(--surface)}
.empty img{height:84px;width:auto;opacity:.9}
.empty h2{font-size:1.4rem}
.empty p{color:var(--ink-2);max-width:42ch}
.empty .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:4px}

/* panels (names/file/test) */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.panel h2{font-size:1.25rem;margin-bottom:6px}
.panel > p{color:var(--ink-2);max-width:64ch}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.col{border-radius:14px;padding:14px;border-left:7px solid}
.col.in{background:var(--blue-tint);border-color:var(--blue)}
.col.out{background:var(--green-tint);border-color:var(--green)}
.col h3{font-size:1.05rem;margin-bottom:10px}
.col.in h3{color:var(--blue-ink)}
.col.out h3{color:var(--green-ink)}

/* names */
.name-grid{display:grid;gap:8px}
.name-row{display:flex;align-items:center;gap:10px}
.name-n{flex:none;width:34px;text-align:right;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.name-row input{flex:1;min-width:0;min-height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 11px}
.name-row input::placeholder{color:var(--ink-2);opacity:.6}

/* test */
.sim-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sim-in{display:flex;gap:6px}
.sim-btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;text-align:left}
.sim-btn b{display:flex;align-items:center;gap:7px}
.sim-btn small{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;min-height:1.3em}
.sim-btn[aria-pressed=true]{background:var(--blue-strong);border-color:var(--blue-strong);color:var(--on-strong)}
.sim-btn[aria-pressed=true] small{color:inherit;opacity:.85}
.sim-mode{width:38px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;display:grid;place-items:center}
.sim-mode[aria-pressed=true]{color:var(--blue-ink);border-color:var(--blue)}
.lamp{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);min-height:66px}
.bulb{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);color:var(--ink-2);transition:background-color .15s,box-shadow .2s}
.lamp.on{border-color:var(--green)}
.lamp.on .bulb{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 0 0 6px rgba(0,150,94,.18),0 0 26px rgba(0,150,94,.55)}
.lamp b{display:block}
.lamp small{display:block;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lamp .timer{color:var(--green-ink);font-weight:600;font-variant-numeric:tabular-nums}
.note{color:var(--ink-2);font-size:.9rem;margin-top:14px}

/* file */
.file-row{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:14px 0}
.field{display:grid;gap:5px;font-weight:600}
.field input[type=text]{min-height:40px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;min-width:220px}
.check{display:flex;align-items:center;gap:9px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--green-strong)}
pre.code{margin:0;max-height:440px;overflow:auto;background:#0E252C;color:#DDEFF4;border-radius:14px;padding:16px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2}
.meta{color:var(--ink-2);font-size:.92rem}

/* dialogs */
dialog{border:0;border-radius:22px;padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--surface);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.35);overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(6,26,32,.6)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 6px 22px}
.dlg-head h2{font-size:1.3rem}
.dlg-body{padding:6px 22px 22px;overflow:auto}
.dlg-sub{color:var(--ink-2);padding:0 22px 4px}
#picker.in .dlg-head{border-top:7px solid var(--blue)}
#picker.out .dlg-head{border-top:7px solid var(--green)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:62px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.tile b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.tile small{color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.78rem}
.in .tile:hover{border-color:var(--blue)}
.out .tile:hover{border-color:var(--green)}
.in .tile[aria-pressed=true]{background:var(--blue-strong);border-color:var(--blue-strong);color:var(--on-strong)}
.out .tile[aria-pressed=true]{background:var(--green-strong);border-color:var(--green-strong);color:var(--on-strong)}
.tile[aria-pressed=true] small{color:inherit}
.tile .used{position:absolute;top:6px;right:7px;font-style:normal;font-size:.72rem;font-weight:700;color:var(--ink-2)}
.tile[aria-pressed=true] .used{color:inherit}
.dl-steps{margin:8px 0 0;padding-left:22px;display:grid;gap:14px}
.ip-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.ip-row input{min-height:42px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;width:210px}
.dlg-actions{display:flex;justify-content:flex-end;margin-top:20px}

/* toast + drop */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 24px);padding:12px 14px 12px 18px;background:#0E252C;color:#fff;border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.35)}
.toast button{border:0;background:none;color:var(--blue);font-weight:700;cursor:pointer;padding:4px 6px}
.drop{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(78,195,224,.88);color:#04222B;font-size:1.6rem;font-weight:700;text-align:center;padding:20px}


/* rule groups */
.rule-top{gap:10px}
.rule-name{flex:1;min-width:0;border:0;border-bottom:1.5px dashed var(--line);background:transparent;padding:6px 4px;font-weight:700;font-size:1.05rem;border-radius:0}
.rule-name:hover{border-bottom-color:var(--blue)}
.rule-name::placeholder{color:var(--ink-2);opacity:.55;font-weight:500}
.rule-name:focus-visible{border-radius:6px}
.expands{color:var(--ink-2);font-size:.85rem;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:3px 4px 3px 11px;font-size:.93rem}
.chip small{color:var(--ink-2);max-width:13ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{width:24px;height:24px;display:grid;place-items:center;border:0;background:none;border-radius:50%;cursor:pointer;color:var(--ink-2)}
.chip button .ic{width:.95em;height:.95em}
.chip button:hover{background:var(--bg);color:var(--ink)}
.chip.more{padding:5px 11px;cursor:pointer;font-weight:700}
.in .chip{border-color:var(--blue)}
.out .chip{border-color:var(--green)}
.chip-add{min-height:34px}
#picker{width:min(900px,calc(100vw - 24px))}
.blk{margin-bottom:16px}
.blk-h{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.blk-h h3{font-size:1.05rem}
.blk-r{color:var(--ink-2);font-size:.9rem;margin-right:auto}
#picker .tiles{grid-template-columns:repeat(8,minmax(0,1fr))}
#picker .tile{min-height:58px}
@media(max-width:600px){#picker .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pick-foot{display:flex;align-items:center;gap:10px;padding:12px 22px;border-top:1px solid var(--line);background:var(--surface)}
.pick-foot .sc{margin-right:auto;font-weight:600}
.name-blk{margin-bottom:14px}
.name-blk h4{margin:0 0 8px;font-size:.98rem}
.name-blk h4 span{color:var(--ink-2);font-weight:400;font-size:.88rem;margin-left:6px}


/* site navigation + install page */
.nav{display:flex;gap:4px;margin-right:4px}
.nav a{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;font-weight:600;text-decoration:none;color:var(--ink-2)}
.nav a:hover{color:var(--ink)}
.nav a[aria-current=page]{color:var(--ink);background:var(--green-tint)}
.actions{display:inline-flex;gap:8px}
.inst-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin:22px 0 16px}
.install-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;min-height:260px}
.inst-logo{height:96px;width:auto}
esp-web-install-button:not(:defined) [slot=unsupported],esp-web-install-button:not(:defined) [slot=not-allowed]{display:none}
.btn.big{min-height:52px;padding:0 26px;font-size:1.08rem}
.warn-text{color:var(--warn);font-weight:600}
.next-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.next-item{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px;border-left:7px solid}
.next-item.in{background:var(--blue-tint);border-color:var(--blue)}
.next-item.out{background:var(--green-tint);border-color:var(--green)}
.next-item p{margin-bottom:10px}
.next-item > .ic{width:1.6em;height:1.6em;margin-top:2px}
.variant .seg-btn{padding:12px 16px;font-size:1rem}
.variant .seg-btn[aria-pressed=true]{background:var(--blue-strong);border-color:var(--blue-strong);color:var(--on-strong)}
@media(max-width:820px){.inst-grid,.next-grid{grid-template-columns:1fr}}
@media(max-width:640px){
  .top .wrap{flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
  .nav{order:10;flex-basis:100%;justify-content:center;margin:0}
}

/* footer */
.foot{margin-top:46px;padding:26px 0 40px;border-top:1px solid var(--line);color:var(--ink-2);font-size:.92rem}
.foot .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px}
.foot img{height:56px;width:auto}
.foot nav{display:flex;flex-wrap:wrap;gap:6px 22px;margin-left:auto}

@media(max-width:640px){
  .brand .word{display:none}
  .top .btn .lbl{display:none}
  .top .btn{padding:0 12px}
  .count{margin-left:0}
  .foot nav{margin-left:0}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</head>
<body>

<script>
//<core>
const Core = (function () {
  const TRIGGERS = ['both', 'rising', 'falling'];
  const ACTIONS = ['toggle', 'on', 'off', 'on_for', 'off_for'];
  const LIMITS = { inputs: 48, outputs: 32, block: 16, rules: 256, maxSeconds: 65535, maxBytes: 32768, metaBytes: 15000, labelLen: 40, nameLen: 60 };
  const isTimer = (a) => a === 'on_for' || a === 'off_for';
  const validSeconds = (s) => Number.isInteger(s) && s >= 1 && s <= LIMITS.maxSeconds;
  const uniqSorted = (arr) => [...new Set(arr)].sort((a, b) => a - b);
  const bytesOf = (s) => new TextEncoder().encode(s).length;

  /* A "rule" in the editor (group) = several inputs, one trigger, several outputs, one action.
     The controller only knows flat rules (one input -> one output), so a group expands to
     every input x output pair. */
  function expand(groups) {
    const out = [];
    for (const g of groups) {
      for (const i of g.ins) {
        for (const o of g.outs) {
          out.push({ in: i, trigger: g.trigger, out: o, action: g.action, seconds: isTimer(g.action) ? g.seconds : null });
        }
      }
    }
    return out;
  }

  function parseRule(r) {
    if (!r || typeof r !== 'object') return null;
    if (!Number.isInteger(r.in) || r.in < 0 || r.in >= LIMITS.inputs) return null;
    if (!Number.isInteger(r.out) || r.out < 0 || r.out >= LIMITS.outputs) return null;
    if (!TRIGGERS.includes(r.trigger) || !ACTIONS.includes(r.action)) return null;
    let seconds = null;
    if (isTimer(r.action)) {
      if (!validSeconds(r.seconds)) return null;
      seconds = r.seconds;
    }
    return { in: r.in, trigger: r.trigger, out: r.out, action: r.action, seconds };
  }

  // Old files and hand-written files have no groups: merge neighbouring rules that
  // only differ in their output, so "one button switches four lights off" is one rule again.
  function fromFlat(rules) {
    const groups = [];
    for (const r of rules) {
      const last = groups[groups.length - 1];
      if (last && last.ins.length === 1 && last.ins[0] === r.in && last.trigger === r.trigger &&
          last.action === r.action && (last.seconds || 0) === (r.seconds || 0) && !last.outs.includes(r.out)) {
        last.outs.push(r.out);
      } else {
        groups.push({ name: '', ins: [r.in], trigger: r.trigger, outs: [r.out], action: r.action, seconds: r.seconds });
      }
    }
    groups.forEach((g) => { g.outs = uniqSorted(g.outs); });
    return groups;
  }

  function parseNumList(v, max) {
    if (!Array.isArray(v) || !v.length) return null;
    if (!v.every((n) => Number.isInteger(n) && n >= 0 && n < max)) return null;
    return uniqSorted(v);
  }

  function parseGroups(list) {
    if (!Array.isArray(list)) return null;
    const groups = [];
    for (const g of list) {
      if (!g || typeof g !== 'object') return null;
      const ins = parseNumList(g.in, LIMITS.inputs);
      const outs = parseNumList(g.out, LIMITS.outputs);
      if (!ins || !outs || !TRIGGERS.includes(g.trigger) || !ACTIONS.includes(g.action)) return null;
      let seconds = null;
      if (isTimer(g.action)) {
        if (!validSeconds(g.seconds)) return null;
        seconds = g.seconds;
      }
      const name = typeof g.name === 'string' ? g.name.trim().slice(0, LIMITS.nameLen) : '';
      groups.push({ name, ins, trigger: g.trigger, outs, action: g.action, seconds });
    }
    return groups;
  }

  const sig = (r) => `${r.in}|${r.trigger}|${r.out}|${r.action}|${r.seconds || 0}`;
  const sameRules = (a, b) => {
    if (a.length !== b.length) return false;
    const x = a.map(sig).sort(), y = b.map(sig).sort();
    return x.every((v, i) => v === y[i]);
  };

  function parseFile(text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { return { error: 'json' }; }
    if (!data || typeof data !== 'object' || Array.isArray(data) || !Array.isArray(data.rules)) return { error: 'format' };
    const rules = [];
    let skipped = 0;
    for (const r of data.rules) {
      const p = parseRule(r);
      if (p) rules.push(p); else skipped++;
    }
    const labels = { in: {}, out: {} };
    if (data.labels && typeof data.labels === 'object' && !Array.isArray(data.labels)) {
      for (const k of ['in', 'out']) {
        const src = data.labels[k];
        if (!src || typeof src !== 'object' || Array.isArray(src)) continue;
        const max = k === 'in' ? LIMITS.inputs : LIMITS.outputs;
        for (const [n, v] of Object.entries(src)) {
          const i = Number(n);
          if (Number.isInteger(i) && i >= 0 && i < max && typeof v === 'string' && v.trim()) {
            labels[k][i] = v.trim().slice(0, LIMITS.labelLen);
          }
        }
      }
    }
    // Use the saved rule layout only when it still matches the flat rules exactly.
    let groups = null, restored = false;
    const saved = parseGroups(data.groups);
    if (saved && skipped === 0 && sameRules(expand(saved), rules)) { groups = saved; restored = true; }
    if (!groups) groups = fromFlat(rules);
    return { groups, labels, skipped, restored };
  }

  function ruleLine(r) {
    let s = `{ "in": ${r.in}, "trigger": "${r.trigger}", "out": ${r.out}, "action": "${r.action}"`;
    if (isTimer(r.action)) s += `, "seconds": ${r.seconds}`;
    return s + ' }';
  }

  function groupLine(g) {
    let s = '{ ';
    if (g.name) s += `"name": ${JSON.stringify(g.name)}, `;
    s += `"in": [${g.ins.join(', ')}], "trigger": "${g.trigger}", "out": [${g.outs.join(', ')}], "action": "${g.action}"`;
    if (isTimer(g.action)) s += `, "seconds": ${g.seconds}`;
    return s + ' }';
  }

  function labelBlock(map) {
    const keys = Object.keys(map).map(Number).sort((a, b) => a - b);
    if (!keys.length) return '{}';
    return '{\n' + keys.map((i) => `      ${JSON.stringify(String(i))}: ${JSON.stringify(map[i])}`).join(',\n') + '\n    }';
  }

  function serialize(groups, labels, withMeta) {
    const flat = expand(groups);
    let s = '{\n  "version": 1,\n  "rules": [';
    if (flat.length) s += '\n' + flat.map((r) => '    ' + ruleLine(r)).join(',\n') + '\n  ';
    s += ']';
    if (withMeta) {

      if (!g.outs.length) issues.push({ level: 'error', code: 'noOut', uid: g.uid, n: i + 1 });

        case 'off_for': this.outputs[o] = false; this.timers.set(o, { end: now + r.seconds * 1000, target: true }); break;

let uidSeq = 1;
const state = { groups: [], labels: { in: {}, out: {} }, fileName: 'fallback.json', includeLabels: true, dirty: false, filter: '', tab: 'rules' };
const hist = { undo: [], redo: [], key: null, time: 0 };
let listStale = true;
let page = 'install';

function t(key, p) {
  let s = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  if (p && typeof s === 'string') s = s.replace(/\{(\w+)\}/g, (m, k) => (k in p ? p[k] : m));
  return s;
}
const newGroup = (o) => Object.assign({ uid: uidSeq++, name: '', ins: [0], trigger: 'rising', outs: [0], action: 'toggle', seconds: null, unit: null }, o || {});
const byUid = (uid) => state.groups.find((g) => g.uid === uid);
const bestUnit = (s) => (s > 0 && s % 3600 === 0 ? 'h' : s > 0 && s % 60 === 0 ? 'min' : 's');
const unitOf = (g) => g.unit || bestUnit(g.seconds || 0);
const plainG = (g) => ({ name: g.name || '', ins: sortNum(g.ins), trigger: g.trigger, outs: sortNum(g.outs), action: g.action, seconds: Core.isTimer(g.action) ? g.seconds : null });
const full = (g) => ({ ...plainG(g), unit: g.unit });
const currentText = () => Core.serialize(state.groups.map(plainG), state.labels, state.includeLabels);
const textBytes = (s) => new Blob([s]).size;
const labelOf = (kind, n) => state.labels[kind][n] || '';
const flatCount = () => Core.expand(state.groups.map(plainG)).length;

function snapshot() { return JSON.stringify({ groups: state.groups.map(full), labels: state.labels }); }
function restore(s) {
  const d = JSON.parse(s);
  state.groups = d.groups.map((g) => newGroup(g));
  state.labels = d.labels;
}

function mutate(fn, key) {
  const now = Date.now();
  if (!(key && hist.key === key && now - hist.time < 1500)) {
    hist.undo.push(snapshot());
    if (hist.undo.length > 60) hist.undo.shift();
  }
  hist.key = key || null;
  hist.time = now;
  hist.redo = [];
  fn();
  state.dirty = true;
  changed(!key);
}
function undo() {
  if (!hist.undo.length) return;
  hist.redo.push(snapshot());
  restore(hist.undo.pop());
  hist.key = null;
  state.dirty = true;
  changed(true, true);
}
function redo() {
  if (!hist.redo.length) return;
  hist.undo.push(snapshot());
  restore(hist.redo.pop());
  hist.key = null;
  state.dirty = true;
  changed(true, true);
}

let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    store.set('logicasa.fallback.draft2', JSON.stringify({ groups: state.groups.map(full), labels: state.labels, fileName: state.fileName, includeLabels: state.includeLabels }));
  }, 400);
}

function changed(rerenderList, everything) {
  if (rerenderList) listStale = true;
  renderChecks();
  if (state.tab === 'rules' && listStale) renderList();
  if (state.tab === 'names' && everything) renderNames();
  if (state.tab === 'file') renderFile();
  if (state.tab === 'test') buildSim();
  scheduleSave();
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, action) {
  const el = $('#toast');
  el.innerHTML = '<span></span>';
  el.firstChild.textContent = msg;
  if (action) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = action.label;
    b.addEventListener('click', () => { action.fn(); el.hidden = true; });
    el.appendChild(b);
  }
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, action ? 7000 : 3500);
}

/* ---------- i18n ---------- */
function applyI18n() {
  document.documentElement.lang = lang;
  document.title = t(page === 'install' ? 'inst.title' : 'app.title') + ' – Logi.casa';
  $$('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  $$('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  $$('[data-i18n-title]').forEach((el) => { const v = t(el.dataset.i18nTitle); el.title = v; el.setAttribute('aria-label', v); });
  const lb = $('#langBtn');
  lb.textContent = lang === 'en' ? 'NL' : 'EN';
  lb.setAttribute('aria-label', lang === 'en' ? 'Nederlands' : 'English');
  lb.title = lb.getAttribute('aria-label');
  $('#presetPop').innerHTML = ['switch', 'push', 'twoin', 'hold', 'timer', 'alloff'].map((k) => `<button type="button" data-preset="${k}">${esc(t('preset.' + k))}</button>`).join('');
  $('#search').setAttribute('aria-label', t('search.ph'));
  listStale = true;
  changed(true, true);
  if (state.tab === 'names') renderNames();
}

/* ---------- chrome ---------- */
let lastIssues = [];
function updateChrome() {
  const n = state.groups.length;
  $('#ruleBadge').textContent = n;
  $('#count').textContent = t('count', { n, f: flatCount(), max: Core.LIMITS.rules });
  $('#undoBtn').disabled = !hist.undo.length;
  $('#redoBtn').disabled = !hist.redo.length;
  $('#undoBtn').style.opacity = hist.undo.length ? 1 : .4;
  $('#redoBtn').style.opacity = hist.redo.length ? 1 : .4;
  $('#sortBtn').disabled = n < 2;
  $('#sortBtn').style.opacity = n < 2 ? .4 : 1;
  $('#empty').hidden = n > 0 || state.tab !== 'rules';
  $('#list').hidden = n === 0;
  const hasErr = lastIssues.some((i) => i.level === 'error');
  $('#dlBtn').disabled = n === 0 || hasErr;
}

function renderChecks() {
  const g = state.groups.map(plainG).map((x, i) => ({ ...x, uid: state.groups[i].uid }));
  lastIssues = Core.validate(g, textBytes(currentText()), Core.metaBytes(state.groups.map(plainG), state.labels), state.includeLabels);
  const box = $('#checks');
  const errs = lastIssues.filter((i) => i.level === 'error');
  const warns = lastIssues.filter((i) => i.level === 'warn');
  if (!state.groups.length) { box.innerHTML = ''; updateChrome(); return; }
  if (!lastIssues.length) {
    box.innerHTML = `<div class="checks ok"><svg class="ic"><use href="#i-check"/></svg><span>${esc(t('checks.ok'))}</span></div>`;
  } else {
    const cls = errs.length ? 'has-err' : 'has-warn';
    const head = errs.length ? t('checks.err', { n: errs.length }) : t('checks.warn', { n: warns.length });
    box.innerHTML = `<details class="checks ${cls}" open><summary><svg class="ic"><use href="#i-warn"/></svg><span>${esc(head)}</span></summary><ul>${lastIssues.map((i) => `<li><button type="button" data-goto="${i.uid || ''}">${esc(t('issue.' + i.code, i))}</button></li>`).join('')}</ul></details>`;
  }
  updateChrome();
}

/* ---------- rule list ---------- */
const matches = (g) => {
  const q = state.filter.trim().toLowerCase();
  if (!q) return true;
  const num = Number(q);
  if (Number.isInteger(num) && (g.ins.includes(num - 1) || g.outs.includes(num - 1))) return true;
  if ((g.name || '').toLowerCase().includes(q)) return true;
  return g.ins.some((i) => labelOf('in', i).toLowerCase().includes(q)) || g.outs.some((o) => labelOf('out', o).toLowerCase().includes(q));
};

function chipsHTML(kind, g) {
  const arr = kind === 'in' ? g.ins : g.outs;
  let h = arr.slice(0, MAXCHIPS).map((n) => {
    const nm = labelOf(kind, n);
    return `<span class="chip"><b>${n + 1}</b>${nm ? `<small>${esc(nm)}</small>` : ''}<button type="button" data-rm="${n}" data-side="${kind}" title="${esc(t('remove'))} ${n + 1}" aria-label="${esc(t('remove'))} ${n + 1}"><svg class="ic"><use href="#i-close"/></svg></button></span>`;
  }).join('');
  if (arr.length > MAXCHIPS) h += `<button type="button" class="chip more" data-pick="${kind}">+${arr.length - MAXCHIPS}</button>`;
  h += `<button type="button" class="btn small chip-add" data-pick="${kind}"><svg class="ic"><use href="#i-plus"/></svg><span>${esc(t(kind + '.' + (arr.length ? 'change' : 'choose')))}</span></button>`;
  return `<div class="chips">${h}</div>`;
}

function durHTML(g) {
  if (!Core.isTimer(g.action)) return '';
  const u = unitOf(g);
  const v = g.seconds ? +(g.seconds / UNIT[u]).toFixed(3) : '';
  return `<div class="dur"><label>${esc(t('time'))}<input class="dur-val" type="number" inputmode="decimal" min="1" step="any" value="${v}"></label><select class="dur-unit" aria-label="${esc(t('unit'))}">${['s', 'min', 'h'].map((x) => `<option value="${x}"${x === u ? ' selected' : ''}>${esc(t('unit.' + x))}</option>`).join('')}</select></div>`;
}

function ruleInner(g, idx) {
  const trig = Core.TRIGGERS.map((k) => `<button type="button" class="seg-btn" data-trigger="${k}" aria-pressed="${g.trigger === k}"><svg class="ic"><use href="#i-${TRIGGER_ICON[k]}"/></svg><span>${esc(t('trigger.' + k))}</span></button>`).join('');
  const acts = Core.ACTIONS.map((k) => `<button type="button" class="seg-btn" data-action="${k}" aria-pressed="${g.action === k}"><svg class="ic"><use href="#i-${ACTION_ICON[k]}"/></svg><span>${esc(t('action.' + k))}</span></button>`).join('');
  const n = g.ins.length * g.outs.length;
  return `
    <div class="rule-top"><span class="rule-n">${esc(t('rule'))} ${idx + 1}</span>
      <input class="rule-name" type="text" maxlength="${Core.LIMITS.nameLen}" value="${esc(g.name || '')}" placeholder="${esc(t('rule.name.ph'))}" aria-label="${esc(t('rule.name.ph'))}">
      <span class="expands" title="${esc(t('expands', { n }))}">${esc(t('expands', { n }))}</span>
      <span class="tools">
        <button type="button" class="icon-btn" data-dup title="${esc(t('dup'))}" aria-label="${esc(t('dup'))}"><svg class="ic"><use href="#i-copy"/></svg></button>
        <button type="button" class="icon-btn" data-del title="${esc(t('del'))}" aria-label="${esc(t('del'))}"><svg class="ic"><use href="#i-trash"/></svg></button>
      </span></div>
    <div class="half in">
      <div class="half-h">${esc(t('when'))}</div>
      ${chipsHTML('in', g)}
      <div class="seg" role="group">${trig}</div>
      <p class="hint">${esc(t('hint.' + g.trigger))}${g.ins.length > 1 ? ' ' + esc(t('multi.in')) : ''}</p>
    </div>
    <div class="link"><svg class="ic"><use href="#i-arrow"/></svg></div>
    <div class="half out">
      <div class="half-h">${esc(t('then'))}</div>
      ${chipsHTML('out', g)}
      <div class="seg" role="group">${acts}</div>
      ${durHTML(g)}
      <p class="hint">${esc(t('ahint.' + g.action))}${g.outs.length > 1 ? ' ' + esc(t('multi.out')) : ''}</p>
    </div>`;
}

function focusKey(el) {
  if (!el || !el.closest) return null;
  const c = el.closest('.rule');
  if (!c) return null;
  const d = el.dataset || {};
  const sel = d.trigger ? `[data-trigger="${d.trigger}"]` : d.action ? `[data-action="${d.action}"]` : d.pick ? `.chip-add[data-pick="${d.pick}"]` : d.rm !== undefined ? `.chip-add[data-pick="${d.side}"]` : 'dup' in d ? '[data-dup]' : el.classList.contains('dur-unit') ? '.dur-unit' : null;
  return sel ? { uid: c.dataset.uid, sel } : null;
}
function restoreFocus(k) {
  if (!k) return;
  const c = document.getElementById('rule-' + k.uid);
  const el = c && c.querySelector(k.sel);
  if (el) el.focus({ preventScroll: true });
}

function renderList() {
  const fk = focusKey(document.activeElement);
  const rows = [];
  state.groups.forEach((g, idx) => { if (matches(g)) rows.push(`<article class="rule" id="rule-${g.uid}" data-uid="${g.uid}">${ruleInner(g, idx)}</article>`); });
  $('#list').innerHTML = rows.join('');
  listStale = false;
  updateChrome();
  restoreFocus(fk);
}
function renderCard(g) {
  const card = document.getElementById('rule-' + g.uid);
  if (!card) return;
  const fk = focusKey(document.activeElement);
  card.innerHTML = ruleInner(g, state.groups.indexOf(g));
  restoreFocus(fk);
}
function scrollToRule(uid, focusPick) {
  const el = document.getElementById('rule-' + uid);
  if (!el) return;
  el.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
  if (focusPick) { const b = el.querySelector('.rule-name'); if (b) b.focus({ preventScroll: true }); }
}

const list = $('#list');
list.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  const card = e.target.closest('.rule');
  if (!b || !card) return;
  const g = byUid(+card.dataset.uid);
  if (!g) return;
  if (b.dataset.pick) { openPicker(b.dataset.pick, g.uid); return; }
  if (b.dataset.rm !== undefined) {
    const key = b.dataset.side === 'in' ? 'ins' : 'outs';
    const n = +b.dataset.rm;
    mutate(() => { g[key] = g[key].filter((x) => x !== n); });
    renderCard(g);
    return;
  }
  if (b.dataset.trigger) { mutate(() => { g.trigger = b.dataset.trigger; }); renderCard(g); return; }
  if (b.dataset.action) {
    mutate(() => {
      g.action = b.dataset.action;
      if (Core.isTimer(g.action)) { if (!g.seconds) { g.seconds = 300; g.unit = 'min'; } } else { g.seconds = null; g.unit = null; }
    });
    renderCard(g);
    return;
  }
  if ('dup' in b.dataset) {
    const copy = newGroup(full(g));
    mutate(() => { state.groups.splice(state.groups.indexOf(g) + 1, 0, copy); });
    scrollToRule(copy.uid);
    return;
  }
  if ('del' in b.dataset) {
    mutate(() => { state.groups.splice(state.groups.indexOf(g), 1); });
    toast(t('deleted'), { label: t('undo.do'), fn: undo });
  }
});
list.addEventListener('input', (e) => {
  const card = e.target.closest('.rule');
  if (!card) return;
  const g = byUid(+card.dataset.uid);
  if (e.target.classList.contains('rule-name')) {
    const v = e.target.value.trim();
    mutate(() => { g.name = v; }, 'gname' + g.uid);
    return;
  }
  if (!e.target.classList.contains('dur-val')) return;
  const v = parseFloat(e.target.value);
  mutate(() => { g.seconds = isFinite(v) && v > 0 ? Math.round(v * UNIT[unitOf(g)]) : null; }, 'dur' + g.uid);
});
list.addEventListener('change', (e) => {
  if (!e.target.classList.contains('dur-unit')) return;
  const card = e.target.closest('.rule');
  const g = byUid(+card.dataset.uid);
  const v = parseFloat($('.dur-val', card).value);
  mutate(() => { g.unit = e.target.value; g.seconds = isFinite(v) && v > 0 ? Math.round(v * UNIT[g.unit]) : null; });
  renderCard(g);
});
$('#checks').addEventListener('click', (e) => {
  const b = e.target.closest('[data-goto]');
  if (!b || !b.dataset.goto) return;
  if (state.filter) { state.filter = ''; $('#search').value = ''; renderList(); }
  scrollToRule(+b.dataset.goto);
});

/* ---------- adding ---------- */
function freeList(kind, count) {
  const max = kind === 'in' ? Core.LIMITS.inputs : Core.LIMITS.outputs;
  const key = kind === 'in' ? 'ins' : 'outs';
  const used = new Set();
  state.groups.forEach((g) => g[key].forEach((n) => used.add(n)));
  const out = [];
  for (let i = 0; i < max && out.length < count; i++) if (!used.has(i)) out.push(i);
  let i = 0;
  while (out.length < count) { if (!out.includes(i % max)) out.push(i % max); i++; }
  return out;
}
function clearFilter() { if (state.filter) { state.filter = ''; $('#search').value = ''; } }

function addRule() {
  clearFilter();
  const g = newGroup({ ins: freeList('in', 1), outs: freeList('out', 1) });
  mutate(() => { state.groups.push(g); });
  scrollToRule(g.uid, true);
}
const PRESETS = {
  switch: () => [{ trigger: 'both', action: 'toggle' }],
  push: () => [{ trigger: 'rising', action: 'toggle' }],
  twoin: () => [{ trigger: 'both', action: 'toggle', nIn: 2 }],
  hold: () => [{ trigger: 'rising', action: 'on' }, { trigger: 'falling', action: 'off' }],
  timer: () => [{ trigger: 'rising', action: 'on_for', seconds: 300, unit: 'min' }],
  alloff: () => [{ trigger: 'rising', action: 'off', nOut: 3 }]
};
function addPreset(key) {
  clearFilter();
  const specs = PRESETS[key]();
  const nIn = Math.max(...specs.map((s) => s.nIn || 1));
  const nOut = Math.max(...specs.map((s) => s.nOut || 1));
  const ins = freeList('in', nIn), outs = freeList('out', nOut);
  const made = specs.map((s) => { const o = { ...s }; delete o.nIn; delete o.nOut; return newGroup({ ins: ins.slice(), outs: outs.slice(), ...o }); });
  mutate(() => { made.forEach((g) => state.groups.push(g)); });
  scrollToRule(made[0].uid, true);
}
$('#addBtn').addEventListener('click', addRule);
$('#emptyAdd').addEventListener('click', addRule);
const presetMenu = $('#presetMenu');
$('#presetPop').addEventListener('click', (e) => {
  const b = e.target.closest('[data-preset]');
  if (!b) return;
  presetMenu.open = false;
  addPreset(b.dataset.preset);
});
document.addEventListener('click', (e) => { if (presetMenu.open && !presetMenu.contains(e.target)) presetMenu.open = false; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && presetMenu.open) { presetMenu.open = false; $('summary', presetMenu).focus(); } });

$('#sortBtn').addEventListener('click', () => {
  mutate(() => { state.groups.sort((a, b) => (a.ins[0] ?? 99) - (b.ins[0] ?? 99) || (a.outs[0] ?? 99) - (b.outs[0] ?? 99)); });
  toast(t('sorted'));
});
$('#undoBtn').addEventListener('click', undo);
$('#redoBtn').addEventListener('click', redo);
$('#search').addEventListener('input', (e) => { state.filter = e.target.value; renderList(); });

/* ---------- picker dialog (multi-select, shown in blocks of 16) ---------- */
const picker = $('#picker');
let pickCtx = null;
function maxOf(kind) { return kind === 'in' ? Core.LIMITS.inputs : Core.LIMITS.outputs; }

function openPicker(kind, uid) {
  const g = byUid(uid);
  if (!g) return;
  const key = kind === 'in' ? 'ins' : 'outs';
  const usage = new Array(maxOf(kind)).fill(0);
  state.groups.forEach((x) => { if (x !== g) x[key].forEach((n) => { usage[n]++; }); });
  pickCtx = { kind, uid, key, sel: new Set(g[key]), start: g[key].slice(), usage };
  $('#pickerTitle').textContent = t(kind === 'in' ? 'pick.inputs' : 'pick.outputs');
  $('#pickerSub').textContent = t('pick.sub.' + kind);
  const blocks = [];
  for (let b = 0; b < maxOf(kind) / BLOCK; b++) {
    const tiles = Array.from({ length: BLOCK }, (_, k) => {
      const i = b * BLOCK + k;
      const nm = labelOf(kind, i);
      const tip = [t(kind === 'in' ? 'input' : 'output') + ' ' + (i + 1), nm, usage[i] ? t('used', { n: usage[i] }) : ''].filter(Boolean).join(' – ');
      return `<button type="button" class="tile" data-n="${i}" aria-pressed="false" title="${esc(tip)}"><b>${i + 1}</b><small>${esc(nm)}</small>${usage[i] ? `<i class="used">${usage[i]}</i>` : ''}</button>`;
    }).join('');
    blocks.push(`<section class="blk" data-b="${b}"><div class="blk-h"><h3>${esc(t('block', { n: b + 1 }))}</h3><span class="blk-r">${esc(t('range.' + kind, { a: b * BLOCK + 1, b: (b + 1) * BLOCK }))}</span><button type="button" class="btn small" data-blk="${b}"></button></div><div class="tiles">${tiles}</div></section>`);
  }
  $('#pickerGrid').innerHTML = blocks.join('');
  picker.className = kind;
  paintPicker();
  picker.showModal();
  const first = $('.tile[aria-pressed="true"]', picker) || $('.tile', picker);
  if (first) first.focus({ preventScroll: true });
}
function paintPicker() {
  if (!pickCtx) return;
  $$('#pickerGrid .tile').forEach((el) => { el.setAttribute('aria-pressed', String(pickCtx.sel.has(+el.dataset.n))); });
  $$('#pickerGrid .blk').forEach((blk) => {
    const b = +blk.dataset.b;
    const all = Array.from({ length: BLOCK }, (_, k) => pickCtx.sel.has(b * BLOCK + k)).every(Boolean);
    $('[data-blk]', blk).textContent = t(all ? 'sel.none' : 'sel.block');
  });
  $('#pickCount').textContent = t('sel.count', { n: pickCtx.sel.size });
}
$('#pickerGrid').addEventListener('click', (e) => {
  if (!pickCtx) return;
  const tile = e.target.closest('.tile');
  const blkBtn = e.target.closest('[data-blk]');
  if (tile) {
    const n = +tile.dataset.n;
    if (pickCtx.sel.has(n)) pickCtx.sel.delete(n); else pickCtx.sel.add(n);
  } else if (blkBtn) {
    const b = +blkBtn.dataset.blk;
    const nums = Array.from({ length: BLOCK }, (_, k) => b * BLOCK + k);
    const all = nums.every((n) => pickCtx.sel.has(n));
    nums.forEach((n) => { if (all) pickCtx.sel.delete(n); else pickCtx.sel.add(n); });
  } else return;
  paintPicker();
});
$('#pickClear').addEventListener('click', () => { if (pickCtx) { pickCtx.sel.clear(); paintPicker(); } });
picker.addEventListener('close', () => {
  const ctx = pickCtx;
  pickCtx = null;
  if (!ctx) return;
  const g = byUid(ctx.uid);
  const now = sortNum([...ctx.sel]);
  if (!g || JSON.stringify(now) === JSON.stringify(sortNum(ctx.start))) return;
  mutate(() => { g[ctx.key] = now; });
  renderCard(g);
});

$$('dialog').forEach((d) => {
  d.addEventListener('click', (e) => { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
});

/* ---------- names tab ---------- */
function renderNames() {
  const mk = (kind, max) => {
    let h = '';
    for (let b = 0; b < max / BLOCK; b++) {
      h += `<div class="name-blk"><h4>${esc(t('block', { n: b + 1 }))} <span>${esc(t('range.' + kind, { a: b * BLOCK + 1, b: (b + 1) * BLOCK }))}</span></h4><div class="name-grid">`;
      for (let k = 0; k < BLOCK; k++) {
        const i = b * BLOCK + k;
        h += `<label class="name-row"><span class="name-n">${i + 1}</span><input type="text" maxlength="${Core.LIMITS.labelLen}" data-kind="${kind}" data-n="${i}" value="${esc(labelOf(kind, i))}" placeholder="${esc(t('names.ph'))}" aria-label="${esc(t(kind === 'in' ? 'input' : 'output'))} ${i + 1}"></label>`;
      }
      h += '</div></div>';
    }
    return h;
  };
  $('#namesIn').innerHTML = mk('in', Core.LIMITS.inputs);
  $('#namesOut').innerHTML = mk('out', Core.LIMITS.outputs);
}
$('#view-names').addEventListener('input', (e) => {
  const el = e.target;
  if (!el.dataset || !el.dataset.kind) return;
  const kind = el.dataset.kind, n = +el.dataset.n, v = el.value.trim();
  mutate(() => { if (v) state.labels[kind][n] = v; else delete state.labels[kind][n]; }, 'name' + kind + n);
  listStale = true;
});
$('#namesClear').addEventListener('click', () => {
  mutate(() => { state.labels = { in: {}, out: {} }; });
  renderNames();
});

/* ---------- file tab ---------- */
function renderFile() {
  const text = currentText();
  $('#json').textContent = text;
  $('#fileMeta').textContent = t('file.meta', { n: state.groups.length, f: flatCount(), kb: (textBytes(text) / 1024).toFixed(1) }) + (state.includeLabels ? ' · ' + t('file.labelsHint') : '');
  if (document.activeElement !== $('#fileName')) $('#fileName').value = state.fileName;
  $('#incLabels').checked = state.includeLabels;
}
$('#fileName').addEventListener('input', (e) => { state.fileName = e.target.value; scheduleSave(); });
$('#incLabels').addEventListener('change', (e) => { state.includeLabels = e.target.checked; changed(false); });
$('#copyBtn').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(currentText()); toast(t('file.copied')); }
  catch (e) { const r = document.createRange(); r.selectNodeContents($('#json')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
});

/* ---------- tabs ---------- */
function showTab(name) {
  state.tab = name;
  $$('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  ['rules', 'test', 'names', 'file'].forEach((n) => { $('#view-' + n).hidden = n !== name; });
  if (name === 'rules' && listStale) renderList();
  if (name === 'names') renderNames();
  if (name === 'file') renderFile();
  if (name === 'test') buildSim(); else stopSim();
  updateChrome();
}
$$('.tab').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));

/* ---------- test (simulator) ---------- */
let sim = null, simTimer = null;
const simMode = {};
const flatRules = () => Core.expand(state.groups.map(plainG));
function usedList(kind) { return sortNum(flatRules().map((r) => r[kind])); }
function stopSim() { clearInterval(simTimer); simTimer = null; }
function buildSim() {
  const ins = usedList('in'), outs = usedList('out');
  const rules = flatRules();
  sim = new Core.Sim(rules);
  $('#simEmpty').hidden = rules.length > 0;
  $('#simCols').hidden = rules.length === 0;
  ins.forEach((i) => { if (!(i in simMode)) simMode[i] = rules.some((r) => r.in === i && r.trigger === 'both') ? 'switch' : 'push'; });
  $('#simIn').innerHTML = ins.map((i) => {
    const nm = labelOf('in', i);
    return `<div class="sim-in" data-i="${i}"><button type="button" class="sim-btn" aria-pressed="false"><b><svg class="ic"><use href="#i-${simMode[i] === 'switch' ? 'switch' : 'press'}"/></svg>${esc(t('input'))} ${i + 1}</b><small>${esc(nm)}</small></button><button type="button" class="sim-mode" aria-pressed="${simMode[i] === 'switch'}" title="${esc(t('test.mode'))}" aria-label="${esc(t('test.mode'))}"><svg class="ic"><use href="#i-lock"/></svg></button></div>`;
  }).join('');
  $('#simOut').innerHTML = outs.map((o) => {
    const nm = labelOf('out', o);
    return `<div class="lamp" data-o="${o}"><span class="bulb"><svg class="ic"><use href="#i-bulb"/></svg></span><span><b>${esc(t('output'))} ${o + 1}</b><small>${esc(nm)}</small><small class="timer"></small></span></div>`;
  }).join('');
  paintSim();
  if (!simTimer && state.tab === 'test') simTimer = setInterval(() => { if (sim.tick(performance.now()) || sim.timers.size) paintSim(); }, 100);
}
function paintSim() {
  if (!sim) return;
  const now = performance.now();
  $$('#simIn .sim-in').forEach((el) => {
    $('.sim-btn', el).setAttribute('aria-pressed', String(sim.inputs[+el.dataset.i]));
  });
  $$('#simOut .lamp').forEach((el) => {
    const o = +el.dataset.o;
    const on = sim.outputs[o];
    el.classList.toggle('on', on);
    $('.bulb use', el).setAttribute('href', on ? '#i-bulb-on' : '#i-bulb');
    const tm = sim.timers.get(o);
    $('.timer', el).textContent = tm ? t('test.left', { s: Math.max(0, Math.ceil((tm.end - now) / 1000)) }) : '';
  });
}
(function wireSim() {
  const host = $('#simIn');
  const press = (el, down) => { sim.setInput(+el.dataset.i, down, performance.now()); paintSim(); };
  host.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('.sim-btn');
    if (!b) return;
    const el = b.closest('.sim-in'), i = +el.dataset.i;
    if (simMode[i] === 'switch') { press(el, !sim.inputs[i]); return; }
    try { b.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    press(el, true);
  });
  const release = (e) => {
    const b = e.target.closest('.sim-btn');
    if (!b) return;
    const el = b.closest('.sim-in');
    if (simMode[+el.dataset.i] === 'push' && sim.inputs[+el.dataset.i]) press(el, false);
  };
  host.addEventListener('pointerup', release);
  host.addEventListener('pointercancel', release);
  host.addEventListener('keydown', (e) => {
    const b = e.target.closest('.sim-btn');
    if (!b || e.repeat || (e.key !== ' ' && e.key !== 'Enter')) return;
    e.preventDefault();
    const el = b.closest('.sim-in'), i = +el.dataset.i;
    press(el, simMode[i] === 'switch' ? !sim.inputs[i] : true);
  });
  host.addEventListener('keyup', (e) => {
    const b = e.target.closest('.sim-btn');
    if (!b || (e.key !== ' ' && e.key !== 'Enter')) return;
    const el = b.closest('.sim-in');
    if (simMode[+el.dataset.i] === 'push') press(el, false);
  });
  host.addEventListener('click', (e) => {
    const m = e.target.closest('.sim-mode');
    if (!m) return;
    const i = +m.closest('.sim-in').dataset.i;
    simMode[i] = simMode[i] === 'switch' ? 'push' : 'switch';
    const keep = sim.outputs.slice();
    buildSim();
    sim.outputs = keep;
    paintSim();
  });
  host.addEventListener('contextmenu', (e) => e.preventDefault());
  $('#simReset').addEventListener('click', buildSim);
})();

/* ---------- open / new / example / download ---------- */
function loadParsed(res, name) {
  mutate(() => {
    state.groups = res.groups.map((g) => newGroup({ ...g, unit: Core.isTimer(g.action) ? bestUnit(g.seconds) : null }));
    state.labels = res.labels;
    state.fileName = name || state.fileName;
    state.includeLabels = true;
  });
  state.dirty = false;
  clearFilter();
  showTab('rules');
  let msg = t('opened', { name: name || 'file', n: res.groups.length });
  if (res.skipped) msg += ' ' + t('skipped', { k: res.skipped });
  toast(msg, { label: t('undo.do'), fn: undo });
}
function openText(text, name) {
  const res = Core.parseFile(text);
  if (res.error) { toast(t('err.' + res.error)); return; }
  loadParsed(res, name);
}
function readFile(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => openText(String(fr.result), file.name);
  fr.readAsText(file);
}
$('#openBtn').addEventListener('click', () => $('#fileInput').click());
$('#emptyOpen').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', (e) => { readFile(e.target.files[0]); e.target.value = ''; });

$('#newBtn').addEventListener('click', () => {
  if (!state.groups.length && !Object.keys(state.labels.in).length && !Object.keys(state.labels.out).length) return;
  mutate(() => { state.groups = []; state.labels = { in: {}, out: {} }; state.fileName = 'fallback.json'; });
  state.dirty = false;
  clearFilter();
  showTab('rules');
  toast(t('new.done'), { label: t('undo.do'), fn: undo });
});

function loadExample() {
  const names = t('example.groups');
  const G = (i, ins, trigger, outs, action, seconds) => ({ name: names[i], ins, trigger, outs, action, seconds: seconds || null });
  const groups = [
    G(0, [0], 'both', [0], 'toggle'),
    G(1, [1, 7], 'rising', [1], 'toggle'),
    G(2, [2], 'rising', [2], 'on'),
    G(3, [2], 'falling', [2], 'off'),
    G(4, [3], 'rising', [3], 'on_for', 10),
    G(5, [4], 'rising', [4], 'off_for', 10),
    G(6, [5], 'rising', [0, 1, 2, 3], 'off')
  ];
  loadParsed({ groups, labels: { in: { ...t('example.labelsIn') }, out: { ...t('example.labelsOut') } }, skipped: 0 }, 'fallback-example.json');
  state.dirty = true;
}
$('#emptyExample').addEventListener('click', loadExample);

function cleanName(n) {
  let s = (n || '').trim().replace(/[\\/:*?"<>|]+/g, '-');
  if (!s) s = 'fallback';
  if (!/\.json$/i.test(s)) s += '.json';
  return s;
}
function download() {
  if (!state.groups.length) { toast(t('err.empty')); return; }
  if (lastIssues.some((i) => i.level === 'error')) { toast(t('err.fix')); return; }
  const name = cleanName(state.fileName);
  const blob = new Blob([currentText()], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  state.dirty = false;
  $('#dlSaved').textContent = t('dl.saved', { name });
  $('#dlDialog').showModal();
  const ip = $('#ipInput');
  if (!ip.value) ip.value = store.get('logicasa.fallback.ip') || '';
  updateCtl();
}
$('#dlBtn').addEventListener('click', download);

function updateCtl() {
  const v = $('#ipInput').value.trim();
  const ok = /^[a-z0-9]([a-z0-9.\-]*[a-z0-9])?(:\d{1,5})?$/i.test(v);
  const a = $('#openCtl');
  a.setAttribute('aria-disabled', String(!ok));
  a.href = ok ? 'http://' + v + '/fallback' : '#';
  if (ok) store.set('logicasa.fallback.ip', v);
}
$('#ipInput').addEventListener('input', updateCtl);
$('#openCtl').addEventListener('click', (e) => { if ($('#openCtl').getAttribute('aria-disabled') === 'true') e.preventDefault(); });

/* ---------- drag and drop ---------- */
let dragDepth = 0;
window.addEventListener('dragenter', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; $('#drop').hidden = false; } });
window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#drop').hidden = true; });
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault();
  dragDepth = 0;
  $('#drop').hidden = true;
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) { showPage('editor'); readFile(f); }
});

/* ---------- keyboard + leaving ---------- */
document.addEventListener('keydown', (e) => {
  if (page !== 'editor') return;
  const mod = e.ctrlKey || e.metaKey;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''));
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); download(); return; }
  if (!mod || typing) return;
  if (e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
});
window.addEventListener('beforeunload', (e) => { if (state.dirty && state.groups.length) { e.preventDefault(); e.returnValue = t('leave'); } });

/* ---------- language ---------- */
$('#langBtn').addEventListener('click', () => {
  lang = lang === 'en' ? 'nl' : 'en';
  store.set('logicasa.lang', lang);
  applyI18n();
  if (state.tab === 'file') renderFile();
  if (state.tab === 'test') buildSim();
  paintVariant();
});

/* ---------- pages (install / editor) ---------- */
let variant = 'ethernet';
function showPage(name) {
  page = name === 'editor' ? 'editor' : 'install';
  $('#page-install').hidden = page !== 'install';
  $('#page-editor').hidden = page !== 'editor';
  $('#editorActions').hidden = page !== 'editor';
  if (page === 'editor') $('#navEditor').setAttribute('aria-current', 'page'); else $('#navEditor').removeAttribute('aria-current');
  if (page === 'install') $('#navInstall').setAttribute('aria-current', 'page'); else $('#navInstall').removeAttribute('aria-current');
  document.title = t(page === 'install' ? 'inst.title' : 'app.title') + ' – Logi.casa';
  if (location.hash !== '#' + page) { try { history.replaceState(null, '', '#' + page); } catch (e) { /* ignore */ } }
  window.scrollTo(0, 0);
  if (page === 'editor') { if (listStale && state.tab === 'rules') renderList(); updateChrome(); }
}
window.addEventListener('hashchange', () => showPage(location.hash === '#editor' ? 'editor' : 'install'));

function paintVariant() {
  $$('#variantSeg .seg-btn').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.variant === variant)));
  $('#variantHint').textContent = t('inst.hint.' + variant);
  $('#espBtn').setAttribute('manifest', 'firmware/' + variant + '/manifest.json');
  const el = $('#fwVersion');
  el.textContent = '';
  fetch('firmware/' + variant + '/manifest.json', { cache: 'no-cache' })
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error('no manifest'))))
    .then((m) => { if (variant === $('#variantSeg [aria-pressed=true]').dataset.variant) el.textContent = m.version ? t('inst.version', { v: m.version }) : ''; })
    .catch(() => { el.textContent = t('inst.noversion'); });
}
$('#variantSeg').addEventListener('click', (e) => {
  const b = e.target.closest('[data-variant]');
  if (!b) return;
  variant = b.dataset.variant;
  paintVariant();
});

/* ---------- start ---------- */
(function init() {
  let restored = false;
  const raw = store.get('logicasa.fallback.draft2');
  if (raw) {
    try {
      const d = JSON.parse(raw);
      const hasLabels = d.labels && (Object.keys(d.labels.in || {}).length || Object.keys(d.labels.out || {}).length);
      if ((d.groups && d.groups.length) || hasLabels) {
        state.groups = (d.groups || []).map((g) => newGroup(g));
        state.labels = { in: (d.labels && d.labels.in) || {}, out: (d.labels && d.labels.out) || {} };
        state.fileName = d.fileName || state.fileName;
        state.includeLabels = d.includeLabels !== false;
        state.dirty = true;
        restored = true;
      }
    } catch (e) { /* ignore a broken draft */ }
  }
  applyI18n();
  showTab('rules');
  showPage(location.hash === '#editor' ? 'editor' : 'install');
  paintVariant();
  if (restored) toast(t('restored'), { label: t('startover'), fn: () => { mutate(() => { state.groups = []; state.labels = { in: {}, out: {} }; }); state.dirty = false; } });
})();

})();
</script>
</body>
